[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "current-measurement"
version = "0.1.0"
description = "Current measurement acquisition and analysis utilities"
readme = "README.md"
requires-python = "==3.10.*"
license = "LicenseRef-Current-Measurement-Tool"
authors = [{ name = "Systems" }]

dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pyserial>=3.5",
  "pybgapi>=1.3.0",
  "pyjoulescope-driver",
  "pytest>=9",
  "power-profiling-tools-val",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--junitxml=artifacts/pytest-results.xml"
filterwarnings = [
  "ignore:.*'oneOf' deprecated - use 'one_of'.*:pyparsing.exceptions.PyparsingDeprecationWarning",
  "ignore:.*'parseString' deprecated - use 'parse_string'.*:pyparsing.exceptions.PyparsingDeprecationWarning",
  "ignore:.*'resetCache' deprecated - use 'reset_cache'.*:pyparsing.exceptions.PyparsingDeprecationWarning",
  "ignore:.*'enablePackrat' deprecated - use 'enable_packrat'.*:pyparsing.exceptions.PyparsingDeprecationWarning",
]

[tool.uv.sources]
power-profiling-tools-val = { git = "https://stash.silabs.com/scm/mcuw_val_sw/power_profiling_tools_val.git" }
