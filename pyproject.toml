[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "current-measurement"
version = "0.1.0"
description = "Current measurement acquisition and analysis utilities"
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "Current measurement tool" }
authors = [{ name = "Systems" }]

dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pyserial>=3.5",
  "pybgapi>=1.3.0",
  "pyjoulescope-driver",
  "pytest>=9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
