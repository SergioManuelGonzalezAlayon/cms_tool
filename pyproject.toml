[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "current-measurement"
version = "0.1.0"
description = "Current measurement acquisition and analysis utilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Current measurement tool" }
authors = [{ name = "Systems" }]

# Runtime deps only (things required to import/run your package)
dependencies = [
  "pyserial>=3.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

